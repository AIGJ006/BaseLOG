# docker-compose(저장소 루트) 접속 정보. app 컨테이너 안에서는 DB_HOST=postgres, REDIS_HOST=redis.
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:blog}
    username: ${POSTGRES_USER:blog}
    password: ${POSTGRES_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
blog:
  nest:
    # 새 키우기 시험용 칸(새 단계 바꾸기·포인트 넣기). 운영(prod)에는 넣지 말 것
    dev-tools: true
