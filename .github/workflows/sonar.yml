# SonarQube 코드 품질 검사 (sonar-project.properties).
# dev에 머지될 때와 PR마다 백엔드·화면 코드를 서버(SONAR_HOST_URL)로 보내 분석한다.
# 시험(ci.yml)과 따로 돌고, 결과는 SonarQube 화면에서 본다. 이 검사가 빨개도 배포를 막지 않는다.
# 백엔드는 시험 없이 컴파일만 한다(시험은 ci.yml 몫). 그래서 커버리지는 표시되지 않는다.
# Secrets(SONAR_TOKEN, SONAR_HOST_URL)가 비어 있으면 안내만 남기고 건너뛴다. 값은 로그에 찍지 않는다.
name: sonar

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 설정 확인
        id: gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_HOST_URL" ]; then
            echo "::notice::SONAR_TOKEN 또는 SONAR_HOST_URL이 비어 있어 SonarQube 검사를 건너뜁니다"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 백엔드 컴파일 (분석용, 시험 없음)
        if: steps.gate.outputs.ready == 'true'
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests test-compile dependency:copy-dependencies -DincludeScope=compile

      - name: SonarQube 분석
        if: steps.gate.outputs.ready == 'true'
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || vars.SONAR_HOST_URL }}
