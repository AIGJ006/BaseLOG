# CI: PR마다 백엔드·화면 시험을 돌린다. 하나라도 빨가면 머지 전에 고친다.
# 바뀐 쪽만 시험한다 — 화면(frontend/)만 바꾼 PR은 백엔드 시험을, 백엔드만 바꾼 PR은 화면 시험을 건너뛴다.
# 문서(*.md)만 바뀐 쪽도 건너뛴다(frontend/src 안의 릴리스 노트 .md는 화면 코드로 본다). 손으로 실행하면 둘 다 돈다.
# dev 머지 뒤에는 다시 돌리지 않는다(PR에서 통과한 것을 deploy.yml이 바로 배포).
#  - backend: ./mvnw verify (단위 시험 + 통합 시험. DB·Redis·MinIO는 Testcontainers가 러너의 도커로 띄운다), 코드 모양(spotless) 검사 포함
#  - frontend: npm ci → lint → 시험(vitest) → 빌드(tsc + vite)
# 비밀값은 쓰지 않는다.
name: ci

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
      - name: 바뀐 쪽 고르기
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "$files"
          # 문서가 아닌 파일 중 frontend/ 밖이 있으면 백엔드, backend/ 밖이 있으면 화면을 시험한다
          # frontend/src 안의 .md(릴리스 노트)는 화면이 읽으므로 코드로 본다
          code=$(echo "$files" | grep -v '\.md$' || true)
          code=$(printf '%s\n%s\n' "$code" "$(echo "$files" | grep '^frontend/src/.*\.md$' || true)" | sed '/^$/d')
          if echo "$code" | grep -v '^frontend/' | grep -q .; then backend=true; else backend=false; fi
          if echo "$code" | grep -v '^backend/' | grep -q .; then frontend=true; else frontend=false; fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 백엔드 시험 (단위 + 통합)
        run: ./mvnw -B -ntp verify

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 린트
        run: npm run lint
      - name: 화면 시험
        run: npm test
      - name: 빌드
        run: npm run build
