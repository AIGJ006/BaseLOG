# CI: PR마다 백엔드·화면 시험을 돌린다. 하나라도 빨가면 머지 전에 고친다.
# dev에 머지(push)될 때는 deploy.yml이 이 워크플로를 먼저 부르고(workflow_call), 초록일 때만 배포한다.
#  - backend: ./mvnw verify (단위 시험 + 통합 시험. DB·Redis·MinIO는 Testcontainers가 러너의 도커로 띄운다), 코드 모양(spotless) 검사 포함
#  - frontend: npm ci → lint → 시험(vitest) → 빌드(tsc + vite)
# 비밀값은 쓰지 않는다.
name: ci

on:
  pull_request:
    branches: [dev, main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 백엔드 시험 (단위 + 통합)
        run: ./mvnw -B -ntp verify

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: 린트
        run: npm run lint
      - name: 화면 시험
        run: npm test
      - name: 빌드
        run: npm run build
