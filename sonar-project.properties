# SonarQube 코드 품질 검사 설정 (.github/workflows/sonar.yml이 읽는다).
# 서버 주소·토큰은 GitHub Secrets(SONAR_HOST_URL, SONAR_TOKEN)에만 둔다.
sonar.projectKey=BaseLOG
sonar.projectName=BaseLOG
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java,frontend/src
sonar.test.inclusions=backend/src/test/java/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/__tests__/**
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/**/__tests__/**,frontend/src/**/*.md,frontend/src/**/art/**

sonar.java.source=21
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes
sonar.java.libraries=backend/target/dependency/*.jar

# 커버리지 (sonar.yml이 시험을 돌려 만든다)
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
